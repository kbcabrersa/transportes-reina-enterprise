<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Enterprise | Transportes Reina</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="login-page">
    <div class="login-card">
        <h1>Enterprise</h1>
        <p>Acceso administrativo Transportes Reina</p>

        <form id="loginEnterprise">
            <input type="email" id="email" placeholder="Correo autorizado" required>
            <input type="password" id="password" placeholder="Clave de acceso" required>

            <button type="submit" class="btn btn-verde">Ingresar</button>
            <p id="loginMensaje"></p>
        </form>

        <a href="../index.html">Volver al inicio</a>
    </div>
</section>

<script src="../js/login-enterprise.js"></script>
</body>
</html>
